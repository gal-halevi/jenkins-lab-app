[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labapp"
version = "0.1.0"
description = "Small HTTP service used to practice Jenkins pipelines"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "gunicorn>=23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests, excluded from the fast suite with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
