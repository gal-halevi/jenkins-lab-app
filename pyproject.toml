[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "labapp"
dynamic = ["version"]
description = "Small HTTP service used to practice Jenkins pipelines"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "gunicorn>=23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Only annotated tags matching v[0-9]* count as releases (no --tags = lightweight tags ignored).
# Keep the pattern in sync with TAG_PATTERN in ci/version.sh.
git_describe_command = ["git", "describe", "--dirty", "--long", "--match", "v[0-9]*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests, excluded from the fast suite with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
